<html>
    <head>
        <title>Ejercicio 2</title>
        <script>
            window.onload = function(){
                //Creo el contenedor para que coincida con el del html
                const contenedor = document.getElementById("contenedor");

                //Creo la tabla para rellenarla
                const tabla = document.createElement("table");

                //Relleno la tabla
                const fila1 = document.createElement("tr");
                const celda1 = document.createElement("td");
                celda1.textContent = "1,1";
                //Meto la primera celda en la primera fila
                fila1.appendChild(celda1);

                const fila2 = document.createElement("tr");
                const celda2 = document.createElement("td");
                celda2.textContent = "1,2";
                // Meter la segunda celda en la segunda fila
                fila2.appendChild(celda2);

                //Meto todo en la tabla
                tabla.appendChild(fila1);
                tabla.appendChild(fila2);

                //Mando la tabla al html
                contenedor.appendChild(tabla);

                //Creamos una funcion para detectar cuando se le de click a el botón
                document.getElementById("darcolor").onclick = function(){
                    //Creamo la variable del estilo
                    const color = "color: blue;font-size: 12px";
                    //Aplicamos el estilo al contenedor
                    document.getElementById("contenedor").style= color;
                }
            }
        </script>
    </head>
    <body>   
        <div id="contenedor"></div>
        <button id="darcolor">Dar color</button>
        <script src="script.js"></script>
    </body>
</html>
