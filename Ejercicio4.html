<html>
    <head>
        <title>Ejercicio 4</title>
        <script>
            window.onload = function(){
                //Creamos una funcion que detecte cuando se le da click a sumar
                document.getElementById("sumar").onclick = function(){
                    //Buscamo la referencia del contenedor
                    const contenedor = document.getElementById("contenedor");
                    //Borramos los hijos (por si se le da mas de una vez al boton de sumar)
                    while (contenedor.firstChild){
                        contenedor.removeChild(contenedor.firstChild);
                    }
                    //Guardamos los valores de los input
                    let n1 = document.getElementById("primero").value;
                    let n2 = document.getElementById("segundo").value;
                    //Hacemos la suma de los input
                    let suma = parseInt(n1) + parseInt(n2);
                    
                    //Creamos lo span donde vamos a meter la informacion
                    const cuadro1 = document.createElement("span");
                    const cuadro2 = document.createElement("span");
                    const cuadro3 = document.createElement("span");
                    const signo = document.createElement("span");
                    const igual = document.createElement("span");

                    //Rellenamos los span
                    cuadro1.innerHTML = n1;
                    cuadro2.innerHTML = n2;
                    cuadro3.innerHTML = suma;
                    signo.innerHTML = "+";
                    igual.innerHTML = "=";

                    //Agregamos los span al html
                    contenedor.appendChild(cuadro1);
                    contenedor.appendChild(signo);
                    contenedor.appendChild(cuadro2);
                    contenedor.appendChild(igual);
                    contenedor.appendChild(cuadro3);
                }
            }
        </script>
    </head>
    <body>
        <input id="primero">
        <input id="segundo">
        <button id="sumar">Sumar</button>
        <div id="contenedor"></div>
    </body>
</html>
