<html>
    <head>
        <title>Ejercicio 5</title>
        <script>
            window.onload = function(){
                //Creamos una funcion que detecte cuando se le da click a cambio
                document.getElementById("cambio").onclick = function(){
                    //Cambiamos las dimensiones de la imagen
                    document.getElementById("imagen").style = "width: 100px; height: 100px";
                }
            }
        </script>
    </head>
    <body>
        <button id="cambio">Cambiar tamaño</button>
        <img id="imagen" src="https://i.blogs.es/f7234d/imagen/500_333.webp">
    </body>
</html>
