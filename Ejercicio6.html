<html>
    <head>
        <title>Ejercicio 5</title>
        <script>
            window.onload = function(){
                //Creamos una funcion que detecte cuando se le da click a cambio
                document.getElementById("cambio").onclick = function(){
                    //Guardamos la informacion de los input en las variables
                    let ancho = document.getElementById("ancho").value;
                    let alto = document.getElementById("alto").value;
                    //Creamos la variable del cambio en funcion a la informacion anteriormente guardada
                    let cambio = "width: " + ancho + "px;height: " + alto + "px";
                    //Cambiamos las dimensiones de la imagen
                    document.getElementById("imagen").style = cambio;
                }
            }
        </script>
    </head>
    <body>
        <img id="imagen" src="https://i.blogs.es/f7234d/imagen/500_333.webp">
        <input id="ancho">
        <span>X</span>
        <input id="alto">
        <button id="cambio">Cambiar tamaño</button>
    </body>
</html>
